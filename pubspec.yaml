name: reise_tracker
description: Offline-Reise-Tracker – vollständig lokal, ohne Cloud, ohne Internet.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Karte (offline, keine Tiles – nur lokale Polygone)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Standort & Hintergrund-Service
  geolocator: ^13.0.2
  flutter_foreground_task: ^8.10.0
  permission_handler: ^11.3.1

  # Lokale Datenhaltung
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

  # Backup über den Android-Dateidialog (SAF, kein Internet)
  flutter_file_dialog: ^3.0.2

  # State-Management
  flutter_riverpod: ^2.6.1

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/geo/countries.geojson.gz
    - assets/geo/regions.geojson.gz
    - assets/geo/cities.json.gz
